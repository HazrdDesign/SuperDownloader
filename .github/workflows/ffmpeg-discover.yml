# Temporary: finds pinned FFmpeg release names and SHA-256 hashes for scripts/fetch_ffmpeg.ps1.
name: ffmpeg-discover
on:
  push:
    paths: [".github/workflows/ffmpeg-discover.yml"]
jobs:
  discover:
    runs-on: windows-latest
    steps:
      - name: List releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list -R GyanD/codexffmpeg --limit 8
      - name: Hash candidates
        shell: pwsh
        run: |
          $tags = (gh release list -R GyanD/codexffmpeg --limit 8 --json tagName | ConvertFrom-Json).tagName | Where-Object { $_ -match '^\d+\.\d+(\.\d+)?$' } | Select-Object -First 3
          foreach ($t in $tags) {
            $name = "ffmpeg-$t-essentials_build.zip"
            foreach ($u in @("https://github.com/GyanD/codexffmpeg/releases/download/$t/$name", "https://www.gyan.dev/ffmpeg/builds/packages/$name")) {
              try {
                Invoke-WebRequest -Uri $u -OutFile $name -UseBasicParsing
                $h = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
                $size = (Get-Item $name).Length
                Write-Host "HASH $u $h $size"
                Remove-Item $name
              } catch { Write-Host "FAIL $u $($_.Exception.Message)" }
            }
            try { $s = (Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/$name.sha256" -UseBasicParsing).Content; Write-Host "PUBLISHED $name $s" } catch { Write-Host "NOPUB $name" }
          }
        env:
          GH_TOKEN: ${{ github.token }}
