name: mac-build

# Builds "Super Downloader.app" for Apple silicon the way scripts/build_mac.sh does on a Mac,
# self-tests it, checks that a copy installed in Applications runs, and uploads the .dmg.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple silicon
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python has Tk
        run: python -c "import tkinter; r = tkinter.Tk(); print('Tk', r.tk.call('info', 'patchlevel')); r.destroy()"

      - name: Build (scripts/build_mac.sh)
        timeout-minutes: 30
        env:
          PYTHON: python
        run: scripts/build_mac.sh

      - name: Bundled tools
        if: always()
        run: |
          cat vendor/ffmpeg/VERSION.txt vendor/deno/VERSION.txt || true
          shasum -a 256 vendor/_downloads/* || true

      - name: Sizes and start-up time
        run: |
          du -sh "dist/Super Downloader.app" dist/SuperDownloader-mac.dmg
          file "dist/Super Downloader.app/Contents/MacOS/SuperDownloader" \
               "dist/Super Downloader.app/Contents/Frameworks/ffmpeg/ffmpeg" \
               "dist/Super Downloader.app/Contents/Frameworks/deno/deno" || find "dist/Super Downloader.app" -name ffmpeg

      - name: Installed from the disk image, the app runs
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/sd dist/SuperDownloader-mac.dmg
          ls -la /tmp/sd
          test -L /tmp/sd/Applications
          ditto "/tmp/sd/Super Downloader.app" "$HOME/Applications/Super Downloader.app"
          hdiutil detach /tmp/sd
          codesign --verify --deep --strict "$HOME/Applications/Super Downloader.app"
          scripts/selftest_mac.sh "$HOME/Applications/Super Downloader.app" "$PWD/build/installed-mac.json"

      - name: App loads an updated engine
        run: |
          export VD_APPDATA="$RUNNER_TEMP/vd-appdata"
          .venv/bin/python -c "from app import updater; i = updater.check_for_update('2000.1.1'); print(updater.install_update(i))"
          export VD_ENGINE_ALLOW_OLDER=1
          scripts/selftest_mac.sh "$PWD/dist/Super Downloader.app" "$VD_APPDATA/selftest.json"
          .venv/bin/python -c "import json, os, sys; r = json.load(open(os.environ['VD_APPDATA'] + '/selftest.json')); sys.exit(0 if r['engine_source'] == 'updated' and r['engine_file'].startswith(os.environ['VD_APPDATA']) else 'did not load the downloaded engine')"

      - name: Live acceptance smoke tests (YouTube, Vimeo)
        continue-on-error: true
        run: .venv/bin/python scripts/acceptance_smoke.py build/acceptance

      # The download people use: just the installer (.dmg).
      - uses: actions/upload-artifact@v4
        with:
          name: SuperDownloader-mac
          path: dist/SuperDownloader-mac.dmg
          if-no-files-found: error

      - name: Test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test-reports
          path: |
            build/selftest-mac.json
            build/installed-mac.json
            build/acceptance
          if-no-files-found: ignore
